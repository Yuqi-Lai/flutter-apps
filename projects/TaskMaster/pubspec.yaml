name: todo_app
description: "A ToDo application with Google Maps integration"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_maps_flutter: ^2.5.0
  location: ^5.0.0
  geocoding: ^3.0.0
  geolocator: ^10.1.0
  permission_handler: ^11.0.1
  http: ^1.1.0
  intl: ^0.19.0
  firebase_core: ^2.24.2
  cloud_firestore: ^4.14.0
  image_picker: ^1.0.7
  provider: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
